<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reset password · Class TT Catalogue</title>
    <link rel="stylesheet" href="assets/styles.css" />
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>
  </head>
  <body>
    <main class="auth">
      <div class="card">
        <h1>Reset password</h1>

        <!-- Two states, one page: asking for a link, and using one. Which one is
             decided by the query string, because the mail points here with a token
             and anything else means the user arrived to start. -->
        <section data-request>
          <p class="muted small">
            Enter the address on your account and we will email a link that lets you
            choose a new password.
          </p>

          <div class="alert error" data-alert hidden></div>
          <div class="alert ok" data-note hidden></div>

          <form data-request-form class="stack" novalidate>
            <div class="field">
              <label for="email">Email</label>
              <input id="email" name="email" type="email" autocomplete="username" required />
            </div>

            <div class="turnstile" data-turnstile></div>

            <button class="btn" type="submit" data-submit>Send the link</button>
          </form>
        </section>

        <section data-confirm hidden>
          <p class="muted small">Choose a new password for your account.</p>

          <div class="alert error" data-confirm-alert hidden></div>
          <div class="alert ok" data-confirm-note hidden></div>

          <form data-confirm-form class="stack" novalidate>
            <div class="field">
              <label for="newPassword">New password</label>
              <input
                id="newPassword"
                name="newPassword"
                type="password"
                autocomplete="new-password"
                minlength="10"
                maxlength="72"
                required
              />
              <p class="small muted">At least 10 characters.</p>
            </div>

            <button class="btn" type="submit" data-confirm-submit>Set the new password</button>
          </form>
        </section>

        <p class="small"><a href="index.html">Back to sign in</a></p>
      </div>
    </main>

    <script type="module" src="assets/reset-password.js"></script>
  </body>
</html>
